# ============================================================
# Civic Monitor НН — Docker Compose
# Сервисы: db (PostgreSQL 15) + api (FastAPI) + frontend (Next.js)
# ============================================================
#
# Запуск:
#   docker compose up -d
#
# Первый запуск (создать БД и прогнать парсер):
#   docker compose exec api python parse.py --days 30
#   docker compose exec api python analyze_topics.py --reset
#   docker compose exec api python detect_bursts.py --reset
#
# Логи:
#   docker compose logs -f api
#   docker compose logs -f frontend
#   docker compose logs -f db
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL 15 — без изменений
  # ----------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: civic_monitor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-civic_monitor}
      POSTGRES_USER:     ${POSTGRES_USER:-civic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localpass123}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civic_user} -d ${POSTGRES_DB:-civic_monitor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # FastAPI — REST API поверх data_repo.py
  # ----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: civic_monitor_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL:      postgresql+psycopg2://${POSTGRES_USER:-civic_user}:${POSTGRES_PASSWORD:-localpass123}@db:5432/${POSTGRES_DB:-civic_monitor}
      VK_TOKEN:          ${VK_TOKEN}
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE:  "1"
      CIVIC_CORS_ORIGINS: "http://localhost:3000,http://frontend:3000"
      CIVIC_REPO_ROOT:   /app
    volumes:
      - hf_cache:/app/.cache/huggingface
      - app_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ----------------------------------------------------------
  # Next.js фронтенд — добавляется в Блоке 4
  # ----------------------------------------------------------
  frontend:
    profiles: [frontend]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civic_monitor_frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Внутри Docker фронт обращается к api по имени сервиса
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # SSR-запросы (server-side) идут напрямую к сервису api
      API_INTERNAL_URL:    http://api:8000
    ports:
      - "3000:3000"

  # ----------------------------------------------------------
  # Streamlit (старый UI) — закомментирован, не удалён
  # ----------------------------------------------------------
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: civic_monitor_app
  #   restart: unless-stopped
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   environment:
  #     POSTGRES_HOST:     db
  #     POSTGRES_PORT:     5432
  #     POSTGRES_DB:       ${POSTGRES_DB:-civic_monitor}
  #     POSTGRES_USER:     ${POSTGRES_USER:-civic_user}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localpass123}
  #     VK_TOKEN:          ${VK_TOKEN}
  #     TRANSFORMERS_OFFLINE: "1"
  #     HF_DATASETS_OFFLINE:  "1"
  #   volumes:
  #     - hf_cache:/app/.cache/huggingface
  #     - app_data:/app/data
  #   ports:
  #     - "8501:8501"

# ----------------------------------------------------------
# Тома — без изменений
# ----------------------------------------------------------
volumes:
  pg_data:
    driver: local
  hf_cache:
    driver: local
  app_data:
    driver: local