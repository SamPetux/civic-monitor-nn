# ============================================================
# Переопределения для локальной разработки.
# ============================================================

services:
  api:
    volumes:
      # Исходники монтируем поверх образа — изменения видны без пересборки
      - .:/app
      - hf_cache:/app/.cache/huggingface
      - app_data:/app/data
    environment:
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE:  "1"